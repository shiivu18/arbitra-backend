spring.application.name=arbitra-backend
server.port=8084

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/arbitra_db
spring.datasource.username=shiivu
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Ollama Endpoint Configuration
ollama.base-url=http://localhost:11434
ollama.model=qwen2.5:7b

# Razorpay Test Credentials
razorpay.key.id=rzp_test_TSKZK5WkPZ52jp
razorpay.key.secret=swQZ79xWEGDsJkoI5ZVQPtLZ

# Expose production health and operational metrics over HTTP
management.endpoints.web.exposure.include=health,info,flyway,metrics
management.endpoint.health.show-details=always

# Disable strict security management mapping for local development
management.endpoint.health.probes.enabled=true

# Springdoc OpenAPI / Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

spring.jpa.open-in-view=false

